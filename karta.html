  }
  /* Mellanbredd: källraden bryts på två rader, så knapparna och kartkontrollerna lyfts över den. */

  .pop .k { color: var(--dampad); font-size: 13px; }
  /* Inbäddat läge: bara kartan och lagerknapparna. Länssidan står för rubriken och texten runt omkring.

  html.inbaddad .lager::-webkit-scrollbar { display: none; }

  html.inbaddad .maplibregl-ctrl-bottom-right { bottom: 54px; }
  html.inbaddad .maplibregl-ctrl-top-right { top: 0; }

<script>
const $ = s => document.querySelector(s);
// Toppens höjd (en eller två rader beroende på skärm) styr var panelen ligger.
const toppHojd = () => document.documentElement.style.setProperty('--topph', Math.round(document.querySelector('.topp').getBoundingClientRect().height) + 'px');
toppHojd(); new ResizeObserver(toppHojd).observe(document.querySelector('.topp'));
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTid = iso => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Stockholm', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const grad = v => v == null ? '–' : (v < 0 ? '−' : '') + Math.abs(Number(v)).toFixed(1).replace('.', ',') + ' °C';
const LAN = { stockholm: [1, 'Stockholms län'], uppsala: [3, 'Uppsala län'], sodermanland: [4, 'Södermanland'], ostergotland: [5, 'Östergötland'],
  jonkoping: [6, 'Jönköpings län'], kronoberg: [7, 'Kronoberg'], kalmar: [8, 'Kalmar län'], gotland: [9, 'Gotland'], blekinge: [10, 'Blekinge'],
  skane: [12, 'Skåne'], halland: [13, 'Halland'], 'vastra-gotaland': [14, 'Västra Götaland'], varmland: [17, 'Värmland'], orebro: [18, 'Örebro län'],
  vastmanland: [19, 'Västmanland'], dalarna: [20, 'Dalarna'], gavleborg: [21, 'Gävleborg'], vasternorrland: [22, 'Västernorrland'],
  jamtland: [23, 'Jämtland'], vasterbotten: [24, 'Västerbotten'], norrbotten: [25, 'Norrbotten'] };
const lanAv = slug => slug && LAN[slug] ? { slug, kod: LAN[slug][0], namn: LAN[slug][1] } : null;
let lanVal = lanAv(new URLSearchParams(location.search).get('lan'));
const SVERIGE = [[10.9, 55.3], [24.2, 69.1]];
for (const [slug, [, namn]] of Object.entries(LAN).sort((a, b) => a[1][1].localeCompare(b[1][1], 'sv'))) {
  const o = document.createElement('option'); o.value = slug; o.textContent = namn; $('#lanval').appendChild(o);
}
$('#lanval').value = lanVal ? lanVal.slug : '';
const INBADDAD = document.documentElement.classList.contains('inbaddad');
// Inbäddad i en sida som skrollar: ett finger skrollar sidan, två fingrar (eller Ctrl/⌘ och hjulet) flyttar kartan.
const map = new maplibregl.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/dark',
  center: [16.3, 62.6], zoom: 4.4, minZoom: 2.8, attributionControl: false,
  cooperativeGestures: INBADDAD,
  locale: {
    'CooperativeGesturesHandler.WindowsHelpText': 'Håll in Ctrl och skrolla för att zooma',
    'CooperativeGesturesHandler.MacHelpText': 'Håll in ⌘ och skrolla för att zooma',
    'CooperativeGesturesHandler.MobileHelpText': 'Använd två fingrar för att flytta kartan'
  }
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
// Källraden längst ner får inte plats på mobilen. Där ligger källorna bakom kartans ⓘ i stället, så att licenserna (CC BY, ODbL) alltid syns.
// Samma sak i inbäddat läge, där källraden är dold.
if (INBADDAD || matchMedia('(max-width: 640px)').matches) {
  map.addControl(new maplibregl.AttributionControl({ compact: true, customAttribution: document.querySelector('.kalla-rad').innerHTML }), 'top-right');
}
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'bottom-right');
// Visa kartan ändå om datan dröjer, så att rutan på länssidan aldrig blir tom.
if (INBADDAD) setTimeout(() => document.documentElement.classList.add('klar'), 4000);
// Kartans fria yta: det som inte ligger under panelen, lagerknapparna eller toppen. Räknas om vid varje inzoomning.
function kanter() {
  const st = document.querySelector('.status').getBoundingClientRect(), la = document.querySelector('.lager').getBoundingClientRect();
  const nere = Math.max(24, Math.round(innerHeight - la.top) + 16);
  if (INBADDAD) return { top: 20, bottom: nere, left: 20, right: 20 };
  if (innerWidth > 900) return { top: Math.round(st.top) + 8, bottom: nere, left: Math.round(st.right) + 32, right: 64 };
  return { top: Math.round(st.bottom) + 16, bottom: nere, left: 20, right: 20 };
}
// En knapp kan styra flera lager (vägvädret ligger i två: de kalla stationerna och resten).
const lagerAv = id => [id, id + '-ovr'].filter(l => map.getLayer(l));
const forstaText = () => (map.getStyle().layers.find(x => x.type === 'symbol') || {}).id;
map.on('load', async () => {
  const d = {};
  for (const name of ['vaglag', 'kandidat', 'vader', 'olyckor', 'kameror', 'meta', 'lan']) {
    try {
      const r = await fetch(name === 'lan' ? 'assets/lan.geojson' : `data/${name}.${name === 'meta' ? 'json' : 'geojson'}?t=${Date.now()}`, { cache: 'no-cache' });
      if (!r.ok) throw 0;
      d[name] = await r.json();
    } catch { d[name] = name === 'meta' ? null : { type: 'FeatureCollection', features: [] }; }
  }
  // Länsgränserna (Natural Earth, public domain): alla svagt, det valda länet gult. Klick på ett län väljer det.
  map.addSource('lan', { type: 'geojson', data: d.lan });
  map.addLayer({ id: 'lan-fyll', type: 'fill', source: 'lan', paint: { 'fill-color': '#FFC94A', 'fill-opacity': 0.02 } }, forstaText());
  map.addLayer({ id: 'lan-alla', type: 'line', source: 'lan', paint: { 'line-color': '#A9B5BB', 'line-width': 1, 'line-opacity': .35 } }, forstaText());
  map.addLayer({ id: 'lan-kant', type: 'line', source: 'lan', filter: ['==', ['get', 'slug'], ''], layout: { 'line-join': 'round' },
    paint: { 'line-color': '#FFC94A', 'line-width': ['interpolate', ['linear'], ['zoom'], 4, 1.5, 9, 3], 'line-opacity': .9 } }, forstaText());
  map.addSource('vaglag', { type: 'geojson', data: d.vaglag });
  map.addLayer({ id: 'vaglag', type: 'line', source: 'vaglag',
    paint: { 'line-width': ['case', ['>', ['get', 'code'], 1], 4, 1.2],
             'line-color': ['case', ['>', ['get', 'code'], 1], '#FFC94A', '#4A5A63'],
             'line-opacity': ['case', ['>', ['get', 'code'], 1], .95, .55] } }, forstaText());
  // Prognos (DECISIONS #579; hette "Halkvakt tror · beta" till 31/10): kandidatens bitar av vägen — modellerat, inte uppmätt. Avslaget från början, och tomt när
  // brytaren är av (#578). Streckat så att det inte förväxlas med Trafikverkets rapporterade halka under.
  map.addSource('kandidat', { type: 'geojson', data: d.kandidat });
  map.addLayer({ id: 'kandidat', type: 'line', source: 'kandidat', layout: { visibility: 'none', 'line-cap': 'round' },
    paint: { 'line-width': 4, 'line-color': '#FF8F6B', 'line-dasharray': [1.4, 1], 'line-opacity': .95 } }, forstaText());
  // Vägväder: stationerna är mätpunkter, inte faror. De ligger under de gula sträckorna och hålls små. Utzoomat syns bara de
  // som visar 0 °C eller kallare; alla stationer kommer fram från zoom 7. Grannländernas stationer är svagare än Sveriges.
  map.addSource('vader', { type: 'geojson', data: d.vader });
  const kall = ['all', ['==', ['typeof', ['get', 'yta']], 'number'], ['<=', ['get', 'yta'], 0]];
  const vaderPaint = { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 1.6, 7, 3, 10, 6],
    'circle-color': ['case', ['==', ['typeof', ['get', 'yta']], 'number'],
      ['step', ['get', 'yta'], '#E9EFF2', 0.01, '#8FA0A9', 3, '#3A4A53'], '#26323A'],
    'circle-stroke-width': ['interpolate', ['linear'], ['zoom'], 6, 0, 8, 1], 'circle-stroke-color': '#080B0D',
    'circle-opacity': ['case', ['==', ['get', 'land'], 'SE'], .9, .4] };
  map.addLayer({ id: 'vader-ovr', type: 'circle', source: 'vader', minzoom: 7, filter: ['!', kall], paint: vaderPaint }, 'vaglag');
  map.addLayer({ id: 'vader', type: 'circle', source: 'vader', filter: kall, paint: vaderPaint }, 'vaglag');
  map.addSource('kameror', { type: 'geojson', data: d.kameror });
  map.addLayer({ id: 'kameror', type: 'circle', source: 'kameror', layout: { visibility: 'none' },
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 1.6, 10, 4.5], 'circle-color': '#6F7C83', 'circle-opacity': .85 } });
  map.addSource('olyckor', { type: 'geojson', data: d.olyckor });
  map.addLayer({ id: 'olyckor', type: 'circle', source: 'olyckor',
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 5, 9, 9], 'circle-color': '#FFC94A',
             'circle-stroke-width': 2, 'circle-stroke-color': '#080B0D' } });
  // Knapparnas läge gäller också om någon tryckte innan lagren fanns (förut ändrades knappen men inte lagret).
  document.querySelectorAll('.chip').forEach(c => lagerAv(c.dataset.layer).forEach(l => map.setLayoutProperty(l, 'visibility', c.getAttribute('aria-pressed') === 'true' ? 'visible' : 'none')));

  const m = d.meta;
  $('#tid').textContent = m ? 'Uppdaterad ' + fmtTid(m.generated_at) : 'Livekartan';
  const granser = f => { const b = new maplibregl.LngLatBounds(); const g = f.geometry;
    (g.type === 'MultiPolygon' ? g.coordinates.flat(2) : g.coordinates.flat()).forEach(c => b.extend(c)); return b; };
  // Ett län: gränsen gul, kartan zoomad dit, panelen med länets vägavsnitt. Utan län: hela landet. Adressen följer med, så den går att dela.
  const visaLan = (val, flyg) => {
    lanVal = val;
    $('#lanval').value = val ? val.slug : '';
    if (!INBADDAD) history.replaceState(null, '', val ? `karta.html?lan=${val.slug}` : 'karta.html');
    map.setFilter('lan-kant', ['==', ['get', 'slug'], val ? val.slug : '']);
    map.setPaintProperty('lan-fyll', 'fill-opacity', val ? ['case', ['==', ['get', 'slug'], val.slug], 0.07, 0.02] : 0.02);
    const fit = { padding: kanter(), maxZoom: 9, duration: flyg ? 900 : 0 };
    if (val) {
      const omr = d.lan.features.find(f => f.properties.slug === val.slug);
      const segs = d.vaglag.features.filter(f => f.properties.lan === val.kod);
      if (omr) map.fitBounds(granser(omr), fit);
      // Inbäddat: kartan stannar vid länet. Man kan dra och zooma, men inte längre bort än en halv vy utanför det man ser från början.
      // Räknat på vyn, inte på länet, så att låset aldrig tvingar kartan närmare än länet får plats.
      if (omr && INBADDAD) {
        const b = map.getBounds(), dx = (b.getEast() - b.getWest()) * .5, dy = (b.getNorth() - b.getSouth()) * .5;
        map.setMaxBounds([[b.getWest() - dx, b.getSouth() - dy], [b.getEast() + dx, b.getNorth() + dy]]);
      }
      const hala = segs.filter(f => f.properties.code > 1).length;
      $('#rubrik').textContent = `Väglaget i ${val.namn} just nu`;
      $('#rader').innerHTML = `${esc(halkMening(hala, segs.length, 'länets'))} <a href="lan/${val.slug}/">Läget i ${esc(val.namn)}</a>`;
      detaljer([]);
    } else {
      map.fitBounds(SVERIGE, fit);
      $('#rubrik').textContent = 'Sveriges väglag just nu';
      const segs = d.vaglag.features;
      if (segs.length) {
        $('#rader').textContent = halkMening(segs.filter(f => f.properties.code > 1).length, segs.length, 'landets');
        const rader = [];
        if (m) {
          rader.push(['Stationer på 0 °C eller kallare', m.kalla_stationer]);
          rader.push(['Olyckor och hinder', m.olyckor]);
          // Bara varningar som gäller vägen; vind till havs säger inget om väglaget. Samma nivå och händelse i flera områden blir EN rad
          // med områdena (18/10: två gula "vind på kalfjället" för överlappande delar av Lapplandsfjällen stod som två likadana rader).
          smhiRader(m.smhi_vinter || []).forEach(t => rader.push(['SMHI', t]));
        }
        detaljer(rader);
      } else {
        $('#rader').textContent = 'Datan kunde inte hämtas just nu. Prova att ladda om sidan.';
        detaljer([]);
      }
    }
  };
  // Samma mening och samma ord för landet och länet: sträckor med halka eller vinterväglag (kod över 1, som motorn).
  /** SMHI:s varningar som rader: en per nivå och händelse, med områdena — "Gul varning: vind på kalfjället · Delar av norra
   *  Lapplandsfjällen och Norra Lapplandsfjällen". Områdena är egennamn och står som SMHI skriver dem. Vind till havs står inte
   *  med; högst två rader. */
  function smhiRader(lista) {
    const grupper = new Map();
    for (const v of lista.filter(v => !/havs/i.test(v.event + ' ' + (v.omrade || '')))) {
      const k = v.niva + '|' + v.event;
      if (!grupper.has(k)) grupper.set(k, { v, omraden: [] });
      const g = grupper.get(k);
      if (v.omrade && !g.omraden.includes(v.omrade)) g.omraden.push(v.omrade);
    }
    return [...grupper.values()].slice(0, 2).map(({ v, omraden: o }) => {
      const var_ = o.length ? ' · ' + (o.length > 1 ? o.slice(0, -1).join(', ') + ' och ' + o[o.length - 1] : o[0]) : '';
      return `${v.niva} varning: ${v.event.toLowerCase()}${var_}`;
    });
  }
  function halkMening(hala, alla, vems) {
    return hala ? `${hala} av ${alla} sträckor med halka eller vinterväglag.` : `Ingen av ${vems} ${alla} sträckor har halka eller vinterväglag i Trafikverkets rapport.`;
  }
  function detaljer(rader) {
    const dl = $('#detaljer');
    dl.innerHTML = rader.map(([k, v]) => `<div><dt>${esc(k)}</dt><dd>${esc(v)}</dd></div>`).join('');
    dl.hidden = !rader.length; $('#mer').hidden = !rader.length;
  }
  visaLan(lanVal, false);
  document.documentElement.classList.add('klar');
  const panelHojd = () => document.documentElement.style.setProperty('--panelhojd', Math.round(document.querySelector('.status').getBoundingClientRect().height + 8) + 'px');
  panelHojd(); new ResizeObserver(panelHojd).observe(document.querySelector('.status'));
  // ⓘ börjar stängd så att källorna inte täcker kartan; ett tryck öppnar dem.
  const attrib = document.querySelector('.maplibregl-ctrl-attrib');
  if (attrib) { attrib.removeAttribute('open'); attrib.classList.remove('maplibregl-compact-show'); }
  $('#mer').addEventListener('click', () => {
    const oppen = $('.status').classList.toggle('oppen');
    $('#mer').setAttribute('aria-expanded', String(oppen));
  });
  $('#lanval').addEventListener('change', e => visaLan(lanAv(e.target.value), true));
  // Brytaren (#578): avstängd kandidat ⇒ knappen säger det och går inte att slå på.
  if (m && m.kandidat && m.kandidat.pa === false) {
    const c = document.querySelector('.chip[data-layer="kandidat"]');
    c.lastChild.textContent = 'Prognos · avstängd'; c.setAttribute('aria-disabled', 'true'); c.title = 'Avstängd just nu';
  }

  const pop = (e, html) => new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat).setHTML(`<div class="pop">${html}</div>`).addTo(map);
  // DMI mäter gräsytan, inte vägen, och nederbördsfältet bär då 'grass' (Halkvakt DECISIONS #45, #585).
  for (const vl of ['vader', 'vader-ovr']) map.on('click', vl, e => { const p = e.features[0].properties; const dk = p.land === 'DK';
    pop(e, `<h3>${esc(p.name)}</h3>
      <div>${dk ? 'Gräsyta' : 'Vägbana'} <b>${grad(p.yta)}</b></div>
      <div>Luft ${grad(p.luft)}</div>
      ${dk ? '' : `<div>Nederbörd ${p.nbd === 'no' ? 'ingen' : esc(p.nbd ?? '–')}</div>`}
      <div class="k">Mätt ${fmtTid(p.t)}</div>`); });
  // Kandidaten (#579) ligger ovanpå väglagslinjen: där den syns går dess ruta före väglagets, och punkterna går före båda (16/10: en station på en väg gav två rutor).
  const under = (e, lager) => map.queryRenderedFeatures(e.point, { layers: lager.filter(l => map.getLayer(l)) }).length > 0;
  map.on('click', 'vaglag', e => { if (under(e, ['kandidat', 'vader', 'vader-ovr', 'olyckor', 'kameror'])) return; const p = e.features[0].properties; let info = [];
    try { info = JSON.parse(p.info || '[]'); } catch {}
    pop(e, `<h3>${esc(p.road ?? 'Vägsträcka')}</h3><div><b>${esc(p.text)}</b></div><div class="k">${esc(info.join(', '))}</div>`); });
  map.on('click', 'olyckor', e => { const p = e.features[0].properties;
    pop(e, `<h3>${esc(p.typ)}${p.road ? ' · ' + esc(p.road) : ''}</h3><div>${esc(p.msg)}</div><div class="k">${esc(p.allvar ?? '')}</div>`); });
  map.on('click', 'kandidat', e => { if (under(e, ['vader', 'vader-ovr', 'olyckor', 'kameror'])) return; const p = e.features[0].properties;
    pop(e, `<h3>Prognos</h3><div><b>Halka framöver</b></div><div>Modellerat, inte uppmätt</div>
      <div class="k">Vägytan beräknad${p.tid ? ' för kl. ' + fmtTid(p.tid) : ''} ur MET Nordic och vägväderstationerna runt omkring.</div>`); });
  map.on('click', 'kameror', e => { const p = e.features[0].properties;
    pop(e, `<h3>Fartkamera</h3><div>${esc(p.name)}</div><div class="k">${esc(p.road ?? '')}</div>`); });
  map.on('click', 'lan-fyll', e => { if (INBADDAD || under(e, ['vaglag', 'kandidat', 'vader', 'vader-ovr', 'olyckor', 'kameror'])) return;
    const slug = e.features[0].properties.slug; if (!lanVal || lanVal.slug !== slug) visaLan(lanAv(slug), true); });
  for (const l of ['vader', 'vader-ovr', 'vaglag', 'kandidat', 'olyckor', 'kameror']) {
    map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
  }
});
let notisTimer = 0;
function notis(rubrik, text) {
  const n = $('#notis');
  n.innerHTML = `<b>${esc(rubrik)}</b>${esc(text)}`; n.hidden = false;
  clearTimeout(notisTimer); notisTimer = setTimeout(() => { n.hidden = true; }, 5000);
}
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  // Avstängt lager (brytaren, #578): knappen går att trycka på men säger bara varför inget visas.
  if (c.getAttribute('aria-disabled') === 'true') {
    notis('Prognos · avstängd', 'Prognosen är avstängd just nu, så ingen beräknad halka visas. Trafikverkets rapporterade halka syns som vanligt.');
    return;
  }
  const pa = c.getAttribute('aria-pressed') !== 'true';
  c.setAttribute('aria-pressed', String(pa));
  lagerAv(c.dataset.layer).forEach(l => map.setLayoutProperty(l, 'visibility', pa ? 'visible' : 'none'));
}));
</script>

<script>if (!INBADDAD) { const s = document.createElement('script'); s.src = '/assets/besok.js'; s.defer = true; document.body.appendChild(s); }</script>
