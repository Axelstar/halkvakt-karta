<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Halkvakt · Sveriges väglag just nu</title>
<meta name="description" content="Livekarta över halka, väglag, vägväder, olyckor och fartkameror på svenska vägar. Data från Trafikverket, uppdaterad var 30:e minut.">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="canonical" href="https://halkvakt.se/karta.html">
<meta property="og:title" content="Sveriges väglag just nu · Halkvakt">
<meta property="og:description" content="Livekarta: halka, väglag, olyckor och fartkameror från Trafikverkets öppna data. Uppdateras var 30:e minut.">
<meta property="og:image" content="https://halkvakt.se/og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="apple-itunes-app" content="app-id=6806939784">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="assets/hv.css">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<style>
  html, body { height: 100%; }
  body { overflow: hidden; }
  #map { position: fixed; inset: 0; background: var(--mark); }
  .topp { position: fixed; left: 0; right: 0; top: 0; }
  .topp .wrap { max-width: none; padding-top: env(safe-area-inset-top, 0px); }
  .rad { position: fixed; z-index: 15; left: 0; right: 0; top: calc(72px + env(safe-area-inset-top, 0px)); padding: 12px clamp(16px, 4vw, 60px);
    pointer-events: none; display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-start; }
  .status { pointer-events: auto; background: rgba(15, 21, 24, .94); border: 1px solid var(--kant); border-radius: 16px; padding: 12px 16px;
    max-width: 560px; display: grid; gap: 6px; }
  .status h1 { font-size: 20px; letter-spacing: -.015em; }
  .status p { color: var(--text2); font-size: 14px; }
  .lager { position: fixed; z-index: 15; left: clamp(16px, 4vw, 60px); right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px));
    display: flex; gap: 8px; flex-wrap: wrap; pointer-events: none; }
  .chip { pointer-events: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 8px 14px; border-radius: 22px;
    border: 1px solid var(--kant); background: rgba(15, 21, 24, .94); color: var(--text); font: 500 11px var(--mono);
    letter-spacing: .12em; text-transform: uppercase; cursor: pointer; }
  .chip i { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .chip i.linje { width: 14px; height: 3px; border-radius: 2px; }
  .chip[aria-pressed="false"] { opacity: .45; }
  .kalla-rad { position: fixed; z-index: 14; right: 12px; bottom: calc(4px + env(safe-area-inset-bottom, 0px)); font: 500 10px var(--mono);
    letter-spacing: .08em; color: var(--dampad2); text-transform: uppercase; }
  .kalla-rad a { color: var(--dampad); }
  @media (max-width: 640px) { .kalla-rad { display: none; } .lager { bottom: calc(12px + env(safe-area-inset-bottom, 0px)); } }
  .maplibregl-ctrl-bottom-right { bottom: 64px; }
  .maplibregl-ctrl-group { background: var(--panel) !important; border: 1px solid var(--kant); }
  .maplibregl-ctrl-group button + button { border-top-color: var(--kant) !important; }
  .maplibregl-ctrl-group button span { filter: invert(1) brightness(.9); }
  .maplibregl-popup-content { background: var(--panel); color: var(--text); border: 1px solid var(--kant); border-radius: 14px;
    font: 14px/1.45 var(--sans); padding: 12px 14px; max-width: 280px; }
  .maplibregl-popup-tip { border-top-color: var(--panel) !important; border-bottom-color: var(--panel) !important; }
  .pop h3 { font: 600 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dampad); margin-bottom: 6px; }
  .pop b { font-family: var(--mono); font-weight: 600; }
  .pop .k { color: var(--dampad); font-size: 13px; }
</style>
</head>
<body>
<div id="map" role="application" aria-label="Karta över svenska väglag"></div>
<header class="topp">
  <div class="wrap">
    <a class="logo" href="./" aria-label="Halkvakt, till startsidan"><svg viewBox="3 3 94 83" aria-hidden="true"><path fill-rule="evenodd" fill="#FFC94A" d="M55.196 6 L96.196 77 A6 6 0 0 1 91 86 L9 86 A6 6 0 0 1 3.804 77 L44.804 6 A6 6 0 0 1 55.196 6 Z M46.4 32 L53.6 32 L52 58 L48 58 Z M45.6 68 A4.4 4.4 0 1 0 54.4 68 A4.4 4.4 0 1 0 45.6 68 Z"/></svg><b>HALKVAKT</b></a>
    <nav class="meny" aria-label="Huvudmeny">
      <a href="./#appen">Appen</a>
      <a href="./#sa-funkar">Så funkar det</a>
      <a href="karta.html" aria-current="page">Livekartan</a>
      <a href="lan/">Länen</a>
    </nav>
    <a class="knapp" href="https://apps.apple.com/se/app/id6806939784">Ladda ner för iPhone</a>
  </div>
</header>
<div class="rad">
  <div class="status" role="status">
    <p class="etikett"><span class="ljus" aria-hidden="true"></span><span id="tid">Livekartan</span></p>
    <h1 id="rubrik">Sveriges väglag just nu</h1>
    <p id="rader">Hämtar Trafikverkets data …</p>
  </div>
</div>
<div class="lager" role="group" aria-label="Kartlager">
  <button class="chip" data-layer="vaglag" aria-pressed="true"><i class="linje" style="background:#FFC94A"></i>Halka</button>
  <button class="chip" data-layer="kandidat" aria-pressed="false" title="Modellerat, inte uppmätt — beta till mars"><i class="linje" style="background:repeating-linear-gradient(90deg,#FF8F6B 0 4px,transparent 4px 7px)"></i>Halkvakt tror · beta</button>
  <button class="chip" data-layer="vader" aria-pressed="true"><i style="background:#E9EFF2"></i>Vägväder</button>
  <button class="chip" data-layer="olyckor" aria-pressed="true"><i style="background:#FFC94A;box-shadow:0 0 0 2px #080B0D,0 0 0 3px #FFC94A"></i>Olyckor</button>
  <button class="chip" data-layer="kameror" aria-pressed="false"><i style="background:#6F7C83"></i>Fartkameror</button>
</div>
<p class="kalla-rad">Data: <a href="https://www.trafikverket.se" rel="noopener">Trafikverket</a> (CC0) · <a href="https://www.digitraffic.fi" rel="noopener">Fintraffic</a> (CC BY 4.0) · <a href="https://www.met.no" rel="noopener">MET Norway</a> (CC BY 4.0) · Karta: <a href="https://openfreemap.org" rel="noopener">OpenFreeMap</a> © OpenStreetMap</p>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmtTid = iso => new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Stockholm', hour: '2-digit', minute: '2-digit' }).format(new Date(iso));
const grad = v => v == null ? '–' : (v < 0 ? '−' : '') + Math.abs(Number(v)).toFixed(1).replace('.', ',') + ' °C';
const map = new maplibregl.Map({
  container: 'map', style: 'https://tiles.openfreemap.org/styles/dark',
  center: [16.3, 62.6], zoom: 4.4, minZoom: 3.6, attributionControl: false
});
map.addControl(new maplibregl.NavigationControl({ showCompass: false }), 'bottom-right');
map.addControl(new maplibregl.GeolocateControl({ trackUserLocation: false }), 'bottom-right');
const forstaText = () => (map.getStyle().layers.find(x => x.type === 'symbol') || {}).id;
map.on('load', async () => {
  const d = {};
  for (const name of ['vaglag', 'kandidat', 'vader', 'olyckor', 'kameror', 'meta']) {
    try {
      const r = await fetch(`data/${name}.${name === 'meta' ? 'json' : 'geojson'}?t=${Date.now()}`, { cache: 'no-cache' });
      if (!r.ok) throw 0;
      d[name] = await r.json();
    } catch { d[name] = name === 'meta' ? null : { type: 'FeatureCollection', features: [] }; }
  }
  map.addSource('vaglag', { type: 'geojson', data: d.vaglag });
  map.addLayer({ id: 'vaglag', type: 'line', source: 'vaglag',
    paint: { 'line-width': ['case', ['>', ['get', 'code'], 1], 4, 1.2],
             'line-color': ['case', ['>', ['get', 'code'], 1], '#FFC94A', '#4A5A63'],
             'line-opacity': ['case', ['>', ['get', 'code'], 1], .95, .55] } }, forstaText());
  // Halkvakt tror · beta (DECISIONS #579): kandidatens bitar av vägen — modellerat, inte uppmätt. Avslaget från början, och tomt när
  // brytaren är av (#578). Streckat så att det inte förväxlas med Trafikverkets rapporterade halka under.
  map.addSource('kandidat', { type: 'geojson', data: d.kandidat });
  map.addLayer({ id: 'kandidat', type: 'line', source: 'kandidat', layout: { visibility: 'none', 'line-cap': 'round' },
    paint: { 'line-width': 4, 'line-color': '#FF8F6B', 'line-dasharray': [1.4, 1], 'line-opacity': .95 } }, forstaText());
  map.addSource('vader', { type: 'geojson', data: d.vader });
  map.addLayer({ id: 'vader', type: 'circle', source: 'vader',
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 2.6, 9, 6],
             'circle-color': ['case', ['==', ['typeof', ['get', 'yta']], 'number'],
               ['step', ['get', 'yta'], '#E9EFF2', 0, '#8FA0A9', 3, '#3A4A53'], '#26323A'],
             'circle-stroke-width': 1, 'circle-stroke-color': '#080B0D', 'circle-opacity': .95 } });
  map.addSource('kameror', { type: 'geojson', data: d.kameror });
  map.addLayer({ id: 'kameror', type: 'circle', source: 'kameror', layout: { visibility: 'none' },
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 1.6, 10, 4.5], 'circle-color': '#6F7C83', 'circle-opacity': .85 } });
  map.addSource('olyckor', { type: 'geojson', data: d.olyckor });
  map.addLayer({ id: 'olyckor', type: 'circle', source: 'olyckor',
    paint: { 'circle-radius': ['interpolate', ['linear'], ['zoom'], 4, 5, 9, 9], 'circle-color': '#FFC94A',
             'circle-stroke-width': 2, 'circle-stroke-color': '#080B0D' } });
  // Knapparnas läge gäller också om någon tryckte innan lagren fanns (förut ändrades knappen men inte lagret).
  document.querySelectorAll('.chip').forEach(c => map.setLayoutProperty(c.dataset.layer, 'visibility', c.getAttribute('aria-pressed') === 'true' ? 'visible' : 'none'));

  const m = d.meta;
  if (m) {
    $('#tid').textContent = 'Livekartan · uppdaterad ' + fmtTid(m.generated_at);
    const bitar = [];
    bitar.push(m.vaglag_ej_normalt > 0 ? `${m.vaglag_ej_normalt} sträckor med besvärligt väglag` : 'Normalt väglag i hela landet');
    if (m.kalla_stationer > 0) bitar.push(`${m.kalla_stationer} stationer på 0 °C eller kallare`);
    bitar.push(`${m.olyckor} pågående olyckor och hinder`);
    if (m.smhi_vinter && m.smhi_vinter.length) { const v = m.smhi_vinter[0]; bitar.push(`SMHI: ${v.niva.toLowerCase()} varning för ${v.event.toLowerCase()}${v.omrade ? ', ' + v.omrade : ''}`); }
    $('#rader').textContent = bitar.join(' · ') + '.';
  } else {
    $('#rader').textContent = 'Datan kunde inte hämtas just nu. Prova att ladda om sidan.';
  }
  // Brytaren (#578): avstängd kandidat ⇒ knappen säger det och går inte att slå på.
  if (m && m.kandidat && m.kandidat.pa === false) {
    const c = document.querySelector('.chip[data-layer="kandidat"]');
    c.lastChild.textContent = 'Halkvakt tror · avstängd'; c.disabled = true; c.title = 'Avstängd just nu';
  }

  const pop = (e, html) => new maplibregl.Popup({ closeButton: false }).setLngLat(e.lngLat).setHTML(`<div class="pop">${html}</div>`).addTo(map);
  map.on('click', 'vader', e => { const p = e.features[0].properties;
    pop(e, `<h3>${esc(p.name)}</h3>
      <div>Vägbana <b>${grad(p.yta)}</b></div>
      <div>Luft ${grad(p.luft)}</div>
      <div>Nederbörd ${p.nbd === 'no' ? 'ingen' : esc(p.nbd ?? '–')}</div>
      <div class="k">Mätt ${fmtTid(p.t)}</div>`); });
  // Kandidaten (#579) ligger ovanpå väglagslinjen: där den syns går dess ruta före väglagets, och punkterna går före kandidaten.
  const under = (e, lager) => map.queryRenderedFeatures(e.point, { layers: lager.filter(l => map.getLayer(l)) }).length > 0;
  map.on('click', 'vaglag', e => { if (under(e, ['kandidat'])) return; const p = e.features[0].properties; let info = [];
    try { info = JSON.parse(p.info || '[]'); } catch {}
    pop(e, `<h3>${esc(p.road ?? 'Vägsträcka')}</h3><div><b>${esc(p.text)}</b></div><div class="k">${esc(info.join(', '))}</div>`); });
  map.on('click', 'olyckor', e => { const p = e.features[0].properties;
    pop(e, `<h3>${esc(p.typ)}${p.road ? ' · ' + esc(p.road) : ''}</h3><div>${esc(p.msg)}</div><div class="k">${esc(p.allvar ?? '')}</div>`); });
  map.on('click', 'kandidat', e => { if (under(e, ['vader', 'olyckor', 'kameror'])) return; const p = e.features[0].properties;
    pop(e, `<h3>Halkvakt tror · beta</h3><div><b>Halka framöver</b> — modellerat, inte uppmätt</div>
      <div class="k">Vägytan beräknad${p.tid ? ' för kl. ' + fmtTid(p.tid) : ''} ur MET Nordic och vägväderstationerna runt omkring. Prövas mot verkligheten till mars.</div>`); });
  map.on('click', 'kameror', e => { const p = e.features[0].properties;
    pop(e, `<h3>Fartkamera</h3><div>${esc(p.name)}</div><div class="k">${esc(p.road ?? '')}</div>`); });
  for (const l of ['vader', 'vaglag', 'kandidat', 'olyckor', 'kameror']) {
    map.on('mouseenter', l, () => map.getCanvas().style.cursor = 'pointer');
    map.on('mouseleave', l, () => map.getCanvas().style.cursor = '');
  }
});
document.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
  const pa = c.getAttribute('aria-pressed') !== 'true';
  c.setAttribute('aria-pressed', String(pa));
  if (map.getLayer(c.dataset.layer)) map.setLayoutProperty(c.dataset.layer, 'visibility', pa ? 'visible' : 'none');
}));
</script>
</body>
</html>
