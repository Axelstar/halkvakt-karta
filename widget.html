<!doctype html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Väglaget just nu, Halkvakt</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  :root { --mark: #080B0D; --panel: #0F1518; --kant: #1E282D; --skilje: #253036; --text: #E9EFF2; --text2: #A9B5BB; --dampad: #8FA0A9;
    --gul: #FFC94A; --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  :root { color-scheme: dark; }
  html[data-tema="ljus"] { color-scheme: light; --panel: #FFFFFF; --kant: #DCE2E5; --skilje: #E6EBED; --text: #111719; --text2: #48555B; --dampad: #6A7880; --gul-tal: #9A6500; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { color: var(--text); font: 400 15px/1.5 var(--sans); padding: 0; }
  .kort { display: grid; gap: 12px; background: var(--panel); border: 1px solid var(--kant); border-radius: 16px; padding: 16px 18px; min-height: 100%; align-content: start; }
  .etikett { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dampad); margin: 0; }
  .etikett .ljus { width: 7px; height: 7px; border-radius: 50%; background: var(--gul); flex: none; }
  .etikett svg { width: 14px; height: auto; flex: none; }
  .etikett b { color: var(--text); font-weight: 600; }
  h1 { margin: 0; font: 600 20px/1.2 var(--sans); letter-spacing: -.01em; }
  .tal { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; border-top: 1px solid var(--skilje); border-bottom: 1px solid var(--skilje); padding: 10px 0; }
  .tal div { min-width: 0; }
  .tal small { display: block; font: 500 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--dampad); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tal strong { display: block; font: 600 24px/1.1 var(--mono); margin-top: 4px; white-space: nowrap; }
  .tal strong.varm { color: var(--gul-tal, var(--gul)); }
  .tal em { display: block; font: 400 12px var(--sans); color: var(--text2); font-style: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  p { margin: 0; color: var(--text2); }
  .fot { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .fot a { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--skilje); padding-bottom: 2px; }
  .fot a:hover { border-color: var(--gul); }
  .fot span { font: 400 11px var(--mono); color: var(--dampad); letter-spacing: .04em; }
  .fot .teknik a { color: var(--dampad); border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: none; text-decoration: underline; }
  @media (max-width: 330px) { .tal { grid-template-columns: 1fr 1fr; } .tal div:last-child { grid-column: 1 / -1; } }
</style>
</head>
<body>
<div class="kort" id="kort">
  <p class="etikett"><svg viewBox="3 3 94 83" aria-hidden="true"><path fill-rule="evenodd" fill="#FFC94A" d="M55.196 6 L96.196 77 A6 6 0 0 1 91 86 L9 86 A6 6 0 0 1 3.804 77 L44.804 6 A6 6 0 0 1 55.196 6 Z M46.4 32 L53.6 32 L52 58 L48 58 Z M45.6 68 A4.4 4.4 0 1 0 54.4 68 A4.4 4.4 0 1 0 45.6 68 Z"/></svg><b id="namn">Halkvakt</b><span id="tid">Hämtar läget</span></p>
  <h1 id="rubrik">Väglaget just nu</h1>
  <div class="tal">
    <div><small>Halka</small><strong id="t-halt">–</strong><em id="t-halt-av">av vägavsnitten</em></div>
    <div><small>Under noll</small><strong id="t-kalla">–</strong><em>vägväderstationer</em></div>
    <div><small>Kallast</small><strong id="t-kallast">–</strong><em id="t-kallast-var">just nu</em></div>
  </div>
  <p id="text">Läget hämtas från Trafikverkets öppna data.</p>
  <div class="fot"><a id="lank" href="https://halkvakt.se/lan/" target="_top" rel="noopener">Läget i alla län</a><span id="kalla">Källa: Halkvakt / Trafikverkets öppna data</span></div>
</div>
<script>
(function () {
  var BAS = 'https://halkvakt.se/';
  var q = new URLSearchParams(location.search);
  var lanSlug = q.get('lan'), vagSlug = q.get('vag');
  var tema = q.get('tema');
  // Mottagarens egen ruta (Bengt 23/10, förslaget till M Sverige), som i ruta.html: &namn= ersätter Halkvakt i rubriken,
  // &lank= och &lanktext= styr länken i foten (bara https). Halkvakt står kvar som teknik i foten. Allt skrivs som text, aldrig som HTML.
  var egetNamn = (q.get('namn') || '').slice(0, 40), egenLank = q.get('lank') || '';
  var sakerLank = function (u) { try { var x = new URL(u); return x.protocol === 'https:' ? x.href : ''; } catch (e) { return ''; } };
  egenLank = sakerLank(egenLank);
  if (tema === 'auto') tema = (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches) ? 'ljus' : 'mork';
  if (tema === 'ljus') document.documentElement.setAttribute('data-tema', 'ljus');
  var $ = function (id) { return document.getElementById(id.replace('#', '')); };
  var minus = function (n) { return String(n).replace('.', ',').replace('-', '−'); };
  var tid = function (iso) {
    try { return new Date(iso).toLocaleTimeString('sv-SE', { timeZone: 'Europe/Stockholm', hour: '2-digit', minute: '2-digit' }); } catch (e) { return ''; }
  };
  var plural = function (n, ett, flera) { return n === 1 ? ett : flera; };

  function visa(d) {
    var rad, namn, lank, genitiv;
    if (lanSlug) {
      rad = d.lan.filter(function (l) { return l.slug === lanSlug; })[0];
      if (rad) { namn = rad.kort; lank = BAS + 'lan/' + rad.slug + '/'; genitiv = 'länets'; }
    } else if (vagSlug) {
      rad = d.vag.filter(function (v) { return v.slug === vagSlug; })[0];
      if (rad) { namn = rad.namn; lank = BAS + 'vag/' + rad.slug + '/'; genitiv = 'vägens'; }
    }
    if (!rad) {
      var kallast = null;
      rad = d.lan.reduce(function (s, l) {
        if (l.kallast && (!kallast || l.kallast.yta < kallast.yta)) kallast = l.kallast;
        return { halt: s.halt + l.halt, vagavsnitt: s.vagavsnitt + l.vagavsnitt, kalla: s.kalla + l.kalla, olyckor: s.olyckor + l.olyckor };
      }, { halt: 0, vagavsnitt: 0, kalla: 0, olyckor: 0 });
      rad.kallast = kallast; namn = 'Sverige'; lank = BAS + 'lan/'; genitiv = 'landets';
    }
    $('#tid').textContent = 'Uppdaterad ' + tid(d.generated_at);
    $('#rubrik').textContent = (lanSlug || !vagSlug ? 'Väglaget i ' : 'Väglaget på ') + namn + ' just nu';
    $('#t-halt').textContent = rad.halt;
    $('#t-halt').className = rad.halt ? 'varm' : '';
    $('#t-halt-av').textContent = 'av ' + rad.vagavsnitt + ' vägavsnitt';
    $('#t-kalla').textContent = rad.kalla;
    $('#t-kalla').className = rad.kalla ? 'varm' : '';
    if (rad.kallast) { $('#t-kallast').textContent = minus(rad.kallast.yta.toFixed(1)) + ' °C'; $('#t-kallast-var').textContent = rad.kallast.namn; }
    else { $('#t-kallast').textContent = 'över 0'; $('#t-kallast-var').textContent = 'alla stationer'; }
    var text;
    if (rad.halt) text = rad.halt + ' av ' + genitiv + ' ' + rad.vagavsnitt + ' vägavsnitt har halka i Trafikverkets rapport.';
    else if (rad.kalla) text = 'Ingen halka rapporterad, men ' + rad.kalla + ' ' + plural(rad.kalla, 'vägväderstation visar', 'vägväderstationer visar') + ' vägbana under noll.';
    else text = 'Ingen halka rapporterad och ingen vägväderstation under noll just nu.';
    if (rad.olyckor) text += ' ' + rad.olyckor + ' ' + plural(rad.olyckor, 'olycka eller hinder pågår.', 'olyckor eller hinder pågår.');
    $('#text').textContent = text;
    $('#lank').href = lank;
    $('#lank').textContent = 'Läget i ' + namn + ' på halkvakt.se';
    if (egenLank) { $('#lank').href = egenLank; $('#lank').textContent = (q.get('lanktext') || 'Mer om trafiken').slice(0, 40); }
    else if (egetNamn) $('#lank').target = '_blank';   // halkvakt.se i ny flik: läsaren ska inte lämna mottagarens sida för oss
  }

  if (egetNamn) {
    $('#namn').textContent = egetNamn + ' · Väglaget'; document.querySelector('.etikett svg').style.display = 'none';
    var k = $('#kalla'); k.textContent = 'Data: Trafikverket · Teknik: '; k.className = 'teknik';
    var h = document.createElement('a'); h.href = 'https://halkvakt.se/'; h.target = '_blank'; h.rel = 'noopener'; h.textContent = 'Halkvakt'; k.appendChild(h);
  }

  var visat = false;
  function hamta() {
    fetch('data/lan.json', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function (d) { visat = true; visa(d); })
      .catch(function () {
        if (visat) return;   // behåll senaste läget om en senare hämtning misslyckas
        $('#tid').textContent = 'Läget kunde inte hämtas';
        $('#text').textContent = 'Se läget direkt på halkvakt.se. Uppdateras var 30:e minut.';
      });
  }
  hamta();
  // Rutan står ofta öppen i en liveblogg: hämta läget igen var femte minut och när fliken visas igen.
  setInterval(function () { if (!document.hidden) hamta(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) hamta(); });
})();
</script>
</body>
</html>
