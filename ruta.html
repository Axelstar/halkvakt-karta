<html lang="sv">

<title>Väglaget just nu, Halkvakt</title>
<link rel="stylesheet" href="assets/fonts/fonts.css">
<style>
  /* Rutan med flikar (DECISIONS #612): länet, länets stora vägar och pendlarstråken i en iframe. Man sveper mellan vyerna

  :root { --panel: #0F1518; --kant: #1E282D; --skilje: #253036; --text: #E9EFF2; --text2: #A9B5BB; --dampad: #8FA0A9;
    --gul: #FFC94A; --gul-yta: rgba(255, 201, 74, .14); --sans: "Instrument Sans", "Helvetica Neue", Arial, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace; }
  :root { color-scheme: dark; }
  html[data-tema="ljus"] { color-scheme: light; --panel: #FFFFFF; --kant: #DCE2E5; --skilje: #E6EBED; --text: #111719; --text2: #48555B; --dampad: #6A7880; --gul-tal: #9A6500; --gul-yta: #FFF4D6; }
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: transparent; }
  body { color: var(--text); font: 400 15px/1.5 var(--sans); }
  .kort { display: flex; flex-direction: column; height: 100%; background: var(--panel); border: 1px solid var(--kant); border-radius: 16px; overflow: hidden; }
  .topp { padding: 14px 18px 0; display: grid; gap: 10px; }
  .etikett { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; font: 500 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--dampad); margin: 0; }
  .etikett svg { width: 14px; height: auto; flex: none; }
  .etikett b { color: var(--text); font-weight: 600; }
  /* Flikarna ritas som knappar (Axel 17/10: syns det att man kan trycka?), och foten pekar på nästa vy. */
  .flikar { display: flex; gap: 4px; padding: 4px; background: var(--skilje); border-radius: 999px; width: max-content; max-width: 100%; }
  .flikar button { appearance: none; background: none; border: 0; border-radius: 999px; padding: 6px 14px;
    font: 600 12px var(--sans); letter-spacing: .02em; color: var(--text2); cursor: pointer; white-space: nowrap; }
  .flikar button:hover { color: var(--text); }
  .flikar button[aria-selected="true"] { color: #111719; background: var(--gul); }
  .flikar button:focus-visible { outline: 2px solid var(--gul); outline-offset: 2px; }
  .nasta { appearance: none; background: none; border: 1px solid var(--kant); border-radius: 999px; padding: 4px 10px; cursor: pointer;
    font: 600 11px var(--mono); letter-spacing: .06em; color: var(--text); white-space: nowrap; }
  .nasta:hover { border-color: var(--gul); }
  .sponsor { margin: -4px 0 0; font: 500 12px var(--sans); color: var(--text2); }
  .sponsor b { color: var(--text); font-weight: 600; }
  .sponsor a { color: inherit; text-decoration: none; }
  .fot .teknik a { color: var(--dampad); border: 0; padding: 0; font: inherit; letter-spacing: inherit; text-transform: none; text-decoration: underline; }
  .hoger { display: flex; align-items: center; gap: 10px; }
  .spar { flex: 1; min-height: 0; display: flex; overflow-x: auto; overflow-y: hidden; scroll-snap-type: x mandatory; scroll-behavior: smooth; scrollbar-width: none; }
  .spar::-webkit-scrollbar { display: none; }
  .vy { flex: 0 0 100%; min-width: 0; scroll-snap-align: start; scroll-snap-stop: always; overflow-y: auto; padding: 14px 18px; display: grid; gap: 12px; align-content: start; }
  h1 { margin: 0; font: 600 19px/1.2 var(--sans); letter-spacing: -.01em; }
  p { margin: 0; color: var(--text2); }
  ul { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--skilje); }
  li { display: grid; grid-template-columns: 58px minmax(0, 1fr); gap: 3px 12px; padding: 8px 0; border-bottom: 1px solid var(--skilje); align-items: baseline; }
  .vag { font: 600 13px var(--mono); white-space: normal; }
  /* Länet som samma radlista som Vägarna och Pendling (Axel 23/10: talrutorna i bredd såg ut som en annan ruta). */
  .lan-lista li { grid-template-columns: 92px minmax(0, 1fr); }
  .lage { font: 600 14px var(--sans); min-width: 0; }
  .lage.halt { color: var(--gul-tal, var(--gul)); }
  .sub { grid-column: 2; font: 400 12px var(--sans); color: var(--text2); }
  .strackor { grid-column: 2; display: flex; flex-wrap: wrap; gap: 4px; }
  .strackor span { font: 600 12px var(--sans); color: var(--text); background: var(--gul-yta); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
  .fot { padding: 10px 18px 12px; border-top: 1px solid var(--skilje); display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  .fot a { font: 600 11px var(--mono); letter-spacing: .14em; text-transform: uppercase; color: var(--text); text-decoration: none; border-bottom: 1px solid var(--skilje); padding-bottom: 2px; }
  .fot a:hover { border-color: var(--gul); }
  .fot span { font: 400 11px var(--mono); color: var(--dampad); letter-spacing: .04em; }
  .prickar { display: flex; gap: 5px; }
  .prickar i { width: 6px; height: 6px; border-radius: 50%; background: var(--skilje); }
  .prickar i.pa { background: var(--gul); }
  @media (prefers-reduced-motion: reduce) { .spar { scroll-behavior: auto; } }
</style>
</head>

  var strakNyckel = q.get('strak') || lanSlug, PEND = STRAK[strakNyckel];

  var $ = function (id) { return document.getElementById(id); };
  var minus = function (n) { return n.toFixed(1).replace('.', ',').replace('-', '−'); };

  var kortVag = function (v) { var m = /^Väg (\d+)$/.exec(v); return m ? (Number(m[1]) < 100 ? 'Rv' : 'Väg\u00a0') + m[1] : v.replace(/^E /, 'E'); };
  var stor = function (v) { var m = /^(E|Väg)\s*(\d+)/.exec(v.vag); return m && (m[1] === 'E' || Number(m[2]) < 100); };
  var strackOrd = function (n) { return n === 1 ? ' sträcka' : ' sträckor'; };

  function chips(lista) { var d = el('div', 'strackor'); lista.forEach(function (s) { d.appendChild(el('span', '', s.plats.replace(/ - /g, '–'))); }); return d; }

  // Flikarna och svepet: spåret rullar i sidled med snäpp, flikarna och prickarna följer.
  var vyer = ['lan', 'vagar', 'pendling'];
  if (!PEND) { $('f-pendling').hidden = true; $('v-pendling').remove(); vyer.pop(); }
  var spar = $('spar'), prickar = $('prickar');
  vyer.forEach(function () { prickar.appendChild(el('i')); });
  function markera(i) {
    vyer.forEach(function (v, k) { $('f-' + v).setAttribute('aria-selected', k === i ? 'true' : 'false'); $('f-' + v).tabIndex = k === i ? 0 : -1; });
    [].forEach.call(prickar.children, function (p, k) { p.className = k === i ? 'pa' : ''; });
    var n = (i + 1) % vyer.length;
    $('nasta').textContent = (n ? '' : '← ') + $('f-' + vyer[n]).textContent + (n ? ' →' : '');
    $('nasta').onclick = function () { ga(n); };
  }
  // Rulla till vyns egen kant, inte i × bredden: vid zoom och bråkdelsbredder hamnade Pendling några pixlar fel (Axel 23/10).
  function ga(i, mjukt) { var v = $('v-' + vyer[i]); spar.scrollTo({ left: v ? v.offsetLeft - spar.offsetLeft : i * spar.clientWidth, behavior: mjukt === false ? 'instant' : 'smooth' }); markera(i); }
  vyer.forEach(function (v, k) { $('f-' + v).addEventListener('click', function () { ga(k); }); });
  $('flikar').addEventListener('keydown', function (e) {
    var i = vyer.indexOf(document.activeElement.id.slice(2));
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); i = (i + (e.key === 'ArrowRight' ? 1 : vyer.length - 1)) % vyer.length; ga(i); $('f-' + vyer[i]).focus(); }
  });
  var rull;
  spar.addEventListener('scroll', function () { clearTimeout(rull); rull = setTimeout(function () { markera(Math.round(spar.scrollLeft / spar.clientWidth)); }, 60); });
  var start = vyer.indexOf(q.get('flik')); if (start < 0) start = 0;
  requestAnimationFrame(function () { ga(start, false); });
  addEventListener('load', function () { ga(start, false); });
  addEventListener('resize', function () { ga(Math.round(spar.scrollLeft / spar.clientWidth), false); });

  if (egetNamn) {
    $('namn').textContent = egetNamn + ' · Väglaget'; document.querySelector('.etikett svg').style.display = 'none';

    if (sl) { sn.href = sl; sn.target = '_blank'; sn.rel = 'noopener sponsored'; sn.style.fontWeight = '600'; sn.style.color = 'var(--text)'; }

  function visaLan(d) {
    var l = d.lan.filter(function (x) { return x.slug === lanSlug; })[0];
    if (!l) return;

    rad('t-olyckor', l.olyckor ? l.olyckor + (l.olyckor === 1 ? ' olycka eller hinder pågår' : ' olyckor eller hinder pågår') : 'Inga pågående', false);

    if (l.olyckor) t += ' ' + l.olyckor + (l.olyckor === 1 ? ' olycka eller hinder pågår.' : ' olyckor eller hinder pågår.');

  function visaVagar(d) {
    var l = d.lan.filter(function (x) { return x.slug === lanSlug; })[0];

    $('vagar-rubrik').textContent = l.kort + 's stora vägar just nu';

    $('vagar-text').textContent = nHalt ? 'Trafikverket rapporterar halka på ' + nHalt + ' av länets ' + n + ' stora vägar.' : 'Trafikverket rapporterar ingen halka på länets stora vägar just nu.';

    var p = PEND;
    if (!p) return;
    $('pendling-rubrik').textContent = p.rubrik || 'Pendlarvägarna från ' + p.fran + ' just nu';

    var pl = $('pendling-lista'), m = 0, mHalt = 0; pl.textContent = '';
    p.strak.forEach(function (s) {
      var delar = s.delar.map(function (x) { return hitta(x[0], x[1]); }).filter(Boolean);
      if (!delar.length) return;
      var halt = delar.filter(function (x) { return x.halt; }); m++; if (halt.length) mHalt++;
      var vagar = []; s.delar.forEach(function (x) { var k = kortVag(x[0]); if (vagar.indexOf(k) < 0) vagar.push(k); });
      var li = el('li');
      // Flera vägar (Väg 136/Väg 137) bryts efter snedstrecket, aldrig inne i ett vägnamn, så de ryms i kolumnen.
      li.appendChild(el('span', 'vag', vagar.map(function (x) { return x.replace(' ', '\u00a0'); }).join('/\u200b')));
      li.appendChild(el('span', 'lage' + (halt.length ? ' halt' : ''), (s.fran || p.fran) + '–' + s.till + ': ' + (halt.length ? 'halka på ' + halt.length + ' av ' + delar.length + strackOrd(delar.length) : 'ingen halka rapporterad')));
      if (halt.length) li.appendChild(chips(halt));
      pl.appendChild(li);
    });
    $('pendling-text').textContent = mHalt ? 'Trafikverket rapporterar halka på ' + mHalt + ' av ' + m + ' stråk.' : 'Trafikverket rapporterar ingen halka på stråken just nu.';
  }

  var visat = false;
  function hamta() {
    var json = function (u) { return fetch(u, { cache: 'no-cache' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); };
    json('data/lan.json').then(function (d) { visat = true; visaLan(d); }).catch(function () {

  }

  setInterval(function () { if (!document.hidden) hamta(); }, 5 * 60 * 1000);
  document.addEventListener('visibilitychange', function () { if (!document.hidden) hamta(); });
