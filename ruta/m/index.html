    var in_ = new URLSearchParams(location.search), f = document.getElementById('ruta'), u = new URL(f.src);
    ['tema', 'lan'].forEach(function (k) { var v = in_.get(k); if (v) u.searchParams.set(k, v); });

  })();
</script>
