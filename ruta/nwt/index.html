<body>
<iframe id="ruta" src="https://halkvakt.se/ruta.html?v=3&amp;lan=varmland&amp;tema=ljus&amp;namn=NWT&amp;lank=https://www.nwt.se/&amp;lanktext=Mer%20trafik%20p%C3%A5%20nwt.se" title="Väglaget i Värmland just nu" loading="eager"></iframe>
<script>
  // Tillval som går vidare till rutan: halkvakt.se/ruta/nwt/?flik=vagar, ?flik=pendling, ?tema=auto, ?sponsor=…
  (function () {
    var in_ = new URLSearchParams(location.search), f = document.getElementById('ruta'), u = new URL(f.src);
    ['flik', 'tema', 'sponsor', 'sponsorlank'].forEach(function (k) { var v = in_.get(k); if (v) u.searchParams.set(k, v); });
    if (u.href !== f.src) f.src = u.href;
  })();
</script>
